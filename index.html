p:5px}.save{background:none;border:0;color:#a5afc3;font-size:23px}.save.on{color:var(--rose)}.soft{padding:13px;border-radius:14px;background:var(--tint)}.empty{background:var(--paper);border:1px dashed #cfd5e5;border-radius:18px;padding:37px;text-align:center;color:var(--muted)}.read{line-height:2;font-size:15px;overflow-wrap:anywhere}.read h1{font-size:25px}.read h2{font-size:21px}.read h3{font-size:16px;color:var(--primary)}.read h1,.read h2,.read h3{line-height:1.5;margin:22px 0 9px}.read p{margin:10px 0 13px;line-height:1.85}.read ul,.read ol{padding-left:25px;margin:12px 0}.read li{margin:6px 0}.read h2{border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:32px}.read h3{margin-top:22px}.read h4,.read h5{color:var(--ink);margin:14px 0 5px}.read{max-width:900px;margin:auto}.read a{color:var(--primary);text-decoration:underline}.read blockquote{border-left:4px solid var(--primary);padding-left:13px}.read .table-scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:15px 0}.read table{border-collapse:collapse;width:100%;font-size:13px;min-width:360px}.read th{background:var(--tint);font-weight:800}.read td,.read th{border:1px solid var(--line);padding:9px 12px;text-align:left}.read tr:nth-child(even){background:var(--tint)}.read details{border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:10px 0}.read summary{font-weight:800;cursor:pointer}.read hr{border:0;border-top:1px solid var(--line);margin:24px 0}.articleSummary{white-space:pre-wrap;color:var(--muted);line-height:1.9}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.field{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px;color:var(--ink)}textarea.field{min-height:210px;width:100%;resize:vertical}.libraryrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:15px 0}.libraryrow:first-child{border-top:0}.game{border:1px solid var(--line);border-radius:16px;padding:19px;margin:15px 0;background:var(--paper)}.game h3{margin:0 0 7px}.answer{margin-top:10px;padding:12px;background:#ebf9f5;color:#285e54;border-radius:12px;white-space:pre-wrap}.small{font-size:12px;color:var(--muted)}.notice{background:#fffae7;border:1px solid #fae8ab;color:#81652e;border-radius:13px;padding:11px 14px;margin:14px 0}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.stats div{background:#ffffff27;border:1px solid #ffffff33;border-radius:10px;padding:8px 13px}.footer{text-align:center;color:var(--muted);font-size:11px;margin:35px 0}.overlay{position:fixed;inset:0;z-index:20;background:#122140a1;display:grid;place-items:center;padding:14px}.modal{background:var(--paper);border-radius:22px;padding:26px;max-width:750px;width:100%;max-height:90vh;overflow:auto}.modal h2{margin:0}.close{float:right;border:0;background:var(--tint);border-radius:10px;padding:8px 12px;color:var(--ink)}.mobile{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#283657;color:white;padding:12px 18px;border-radius:10px;z-index:25}body.dark{--bg:#141b2d;--paper:#202c40;--ink:#eaf0ff;--muted:#abb7ca;--line:#35445d;--tint:#303e61;--shadow:none}body.dark .pill{background:#2b3752;color:#b7c5dc}body.dark .pill.active{background:var(--primary);color:white}body.dark .notice{background:#3e3320;border-color:#6d5831;color:#f2d591}body.dark .answer{background:#223f3b;color:#b4e6ce}@media(max-width:1000px){.shell{grid-template-columns:195px minmax(0,1fr)}.hero h2{font-size:32px}}@media(max-width:720px){.shell{display:block}.side{display:none}.main{padding:20px 15px 85px}.top h1{font-size:20px}.top{margin-bottom:18px}.actions .primary{padding:10px;font-size:11px}.hero{padding:22px;min-height:190px}.hero h2{font-size:29px}.heroStat{display:none}.grid,.split{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:17px}.mobile{display:flex;position:fixed;bo </style></head><body><div class="shell"><aside class="side"><div class="brand"><span>☀</span>Daily Brief</div><div class="tagline">A little brighter. Every day.</div><nav class="nav" id="sideNav"><button class="active" data-view="today"><span>⌂</span>Today · ข่าววันนี้</button><button data-view="deep"><span>▤</span>Daily Deep Dive</button><button data-view="games"><span>♧</span>Brain Break</button><button data-view="library"><span>▦</span>Library</button><button data-view="saved"><span>♡</span>บันทึกไว้</button></nav><div class="sidefoot">✨ <b>ข่าวทุกเช้า แบบไม่ต้องยุ่งยาก</b><br>RSS อัตโนมัติ + บทสรุป ChatGPT ที่คุณเลือกเก็บไว้</div></aside><main class="main"><header class="top"><div><div class="tiny">YOUR PERSONAL NEWSPAPER</div><h1 id="pageTitle">Good morning ☀️</h1></div><div class="actions"><button class="circle" id="darkBtn" aria-label="เปลี่ยนโหมดสี">☾</button><button class="btn primary" id="addBtn">＋ เพิ่ม Deep Dive</button></div></header><div id="app"></div><div class="footer">Daily Brief · ข่าวอ้างอิง RSS จากสำนักข่าว · บทสรุปที่นำเข้าเก็บไว้ในเบราว์เซอร์ของอุปกรณ์นี้</div></main></div><nav class="mobile" id="mobileNav"><button class="active" data-view="today"><span>⌂</span>Today</button><button data-view="deep"><span>▤</span>Deep Dive</button><button data-view="games"><span>♧</span>Games</button><button data-view="library"><span>▦</span>Library</button><button data-view="saved"><span>♡</span>Saved</button></nav><div id="modalRoot"></div><script>
'use strict';
const $=id=>document.getElementById(id), app=$('app'); const KEYS={brief:'db_hybrid_briefs_v1',saved:'db_hybrid_saved_v1',theme:'db_hybrid_theme_v1'};
const categories={thailand:['🇹🇭','ข่าวไทย'],world:['🌏','ข่าวโลก'],finance:['💰','เศรษฐกิจ'],technology:['🤖','เทคโนโลยี'],sports:['⚽','กีฬา'],music:['🎧','เพลงสากล'],bts:['💜','BTS']};
const safeLoad=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};let briefs=safeLoad(KEYS.brief,[]),saved=safeLoad(KEYS.saved,[]),news=null,archive=[],view='today',category='all',selectedBrief=null,selectedDay=null,allGames=[{title:'นาฬิกาทรายสองอัน',question:'มีนาฬิกาทราย 7 และ 11 นาที จะจับเวลา 15 นาทีได้อย่างไร?',answer:'เริ่มพร้อมกัน พลิกนาฬิกา 7 นาทีเมื่อหมดที่นาที 7 และพลิกอีกครั้งที่นาที 11 จับเวลาได้ครบ 15 นาที'},{title:'ถังน้ำปริศนา',question:'มีถังน้ำ 5 ลิตร กับ 3 ลิตร จะตวงน้ำให้ได้ 4 ลิตรอย่างไร?',answer:'เติม 5 → เทใส่ 3 เหลือ 2 → เท 3 ทิ้ง → ย้าย 2 ไปถัง 3 → เติม 5 อีกครั้ง → เทเพิ่ม 1 ลงถัง 3 เหลือ 4 ลิตร'},{title:'เงินหายไปไหน?',question:'ค่าห้อง 30 บาท คืนให้ลูกค้า 3 บาท พนักงานเก็บ 2 บาท ทำไม 27 + 2 จึงได้ 29?',answer:'ต้องคิด 27 = 25 (ค่าห้อง) + 2 (พนักงานเก็บ) รวมกับเงินคืน 3 เป็น 30 บาท'}];
let fallbackGames=allGames;const persist=()=>{try{localStorage.setItem(KEYS.brief,JSON.stringify(briefs));localStorage.setItem(KEYS.saved,JSON.stringify(saved));return true}catch{toast('พื้นที่เก็บข้อมูลเต็ม กรุณาลบฉบับเก่าหรือส่งออกสำรอง');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
const dateTH=d=>{try{return new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})}catch{return d}};
const todayLocal=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const short=s=>String(s||'').replace(/<[^>]+>/g,'').replace(/\*\*/g,'').replace(/\[[^\]]+\]\([^)]+\)/g,'').slice(0,175);
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2900)}
function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(text){
  // Escape all untrusted text, then interpret a restricted Markdown subset.
  // The importer never executes HTML supplied by a Daily Brief.
  const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  const out=[];let para=[],list=null,table=null,detail=false,quote=[];
  const flushP=()=>{if(para.length){out.push('<p>'+inline(para.join(' ').trim())+'</p>');para=[]}};
  const flushQuote=()=>{if(quote.length){out.push('<blockquote>'+quote.map(x=>inline(x)).join('<br>')+'</blockquote>');quote=[]}};
  const flushList=()=>{if(list){out.push('</'+list+'>');list=null}};
  const flushTable=()=>{if(table){out.push('</tbody></table></div>');table=null}};
  const flush=()=>{flushP();flushQuote();flushList();flushTable()};
  function cellsOf(s){return s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim())}
  function isSeparator(s){return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(s)}
  function isTableHead(i){return i+1<lines.length && lines[i].includes('|') && isSeparator(lines[i+1]);}
  for(let i=0;i<lines.length;i++){
    const s=lines[i].trim();
    if(!s){flushP();flushQuote();flushList();flushTable();continue}
    if(/^<details(?:\s+[^>]*)?>$/i.test(s)){flush();out.push('<details>');detail=true;continue}
    if(/^<\/details>$/i.test(s)){flush();if(detail)out.push('</details>');detail=false;continue}
    const sm=s.match(/^<summary>([\s\S]*?)<\/summary>$/i);
    if(sm){flush();out.push('<summary>'+inline(sm[1].replace(/<\/?(?:strong|b)>/gi,''))+'</summary>');continue}
    if(/^---+$/.test(s)){flush();out.push('<hr>');continue}
    let h=s.match(/^(#{1,6})\s+(.+)$/);
    if(h){flush();const n=Math.min(h[1].length+1,5);out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');continue}
    if(isTableHead(i)){
      flush();let columns=cellsOf(s);out.push('<div class="table-scroll"><table><thead><tr>'+columns.map(c=>'<th scope="col">'+inline(c)+'</th>').join('')+'</tr></thead><tbody>');table=true;i++;continue;
    }
    if(table){
      if(s.includes('|')&&!isSeparator(s)){let cells=cellsOf(s);out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');continue}
      flushTable();
    }
    if(/^>\s?/.test(s)){flushP();flushList();quote.push(s.replace(/^>\s?/,''));continue}
    flushQuote();
    const ol=s.match(/^(\d+)[.)]\s+(.+)$/),ul=s.match(/^[-*+]\s+(.+)$/);
    if(ol||ul){flushP();let type=ol?'ol':'ul';if(list!==type){flushList();out.push('<'+type+'>');list=type}out.push('<li>'+inline((ol?ol[2]:ul[1]))+'</li>');continue}
    flushList();
    if(/^\|.*\|$/.test(s)){flushP();out.push('<p>'+inline(s)+'</p>');continue}
    if(/^<[^>]+>$/.test(s)){out.push('<p>'+esc(s)+'</p>');continue}
    para.push(s.replace(/\s{2,}$/,''));
  }
  flush();if(detail)out.push('</details>');return out.join('\n');
}
function readNewsKey(n){return (n.url||n.title||'').slice(0,400)}
function story(n,i){let key=readNewsKey(n),isSaved=saved.some(x=>x.key===key);return `<div class="news"><span class="num">${i+1}</span><div class="story"><button class="headline" data-open="${esc(key)}">${esc(n.title||'ไม่มีหัวข้อ')}</button><div class="meta">${esc(n.source||'สำนักข่าว')} ${n.published?' · '+esc(n.published):''}</div></div><button class="save ${isSaved?'on':''}" data-save="${esc(key)}" title="บันทึกข่าว" aria-label="บันทึกข่าว">${isSaved?'♥':'♡'}</button></div>`}
function panel(cat,items){let [icon,title]=categories[cat];return `<section class="card"><div class="cardhead"><h3>${icon} ${title}</h3><span class="hint">${items.length} ข่าว</span></div>${items.length?items.map(story).join(''):'<div class="hint" style="padding:25px 0">หมวดนี้ยังไม่มีข่าวจากแหล่ง RSS ในรอบล่าสุด</div>'}</section>`}
function listNews(){let result=[];for(let k of Object.keys(categories))for(let n of (news?.[k]||[]))if(!result.some(x=>readNewsKey(x)===readNewsKey(n)))result.push(n);return result}
function findNews(key){return listNews().find(n=>readNewsKey(n)===key)||saved.find(x=>x.key===key)?.item}
function renderToday(){let date=new Date(),counts=listNews().length,upd=news?.generated_at?new Date(news.generated_at).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'}):'ยังไม่มีข้อมูล';let choice=category==='all'?Object.keys(categories):[category];app.innerHTML=`<section class="hero"><div><div style="font-size:12px">${date.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2>A fresh little perspective. ☀️</h2><p>ข่าวสำคัญสำหรับวันใหม่ พร้อมลิงก์อ่านต้นฉบับจากสำนักข่าวที่คุณสนใจ</p><div class="stats"><div>📰 ${counts} ข่าวล่าสุด</div><div>🕒 อัปเดต ${esc(upd)}</div></div></div><div class="heroStat"><small>YOUR DAILY READ</small><strong>5–10</strong><small>นาทีที่ดีของวันนี้</small></div></section><div class="pillrow"><button class="pill ${category==='all'?'active':''}" data-cat="all">ทั้งหมด</button>${Object.entries(categories).map(([k,v])=>`<button class="pill ${category===k?'active':''}" data-cat="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>${news?.warnings?.length?`<div class="notice">บางแหล่งข่าวอาจตอบกลับไม่สำเร็จ (${news.warnings.length} แหล่ง) แต่ข้อมูลที่แสดงดึงมาจาก RSS ที่ได้รับจริง</div>`:''}${!news?`<div class="empty"><h3>ยังไม่มีข่าวออนไลน์ที่ดึงสำเร็จ</h3><p>หลังอัปโหลดเว็บ ให้ไปที่ GitHub → Actions → Daily news refresh and publish → Run workflow เพื่อสร้างข่าวครั้งแรก</p><button class="btn primary" data-refresh>ลองโหลดข้อมูลอีกครั้ง</button></div>`:`<div class="grid">${choice.map(k=>panel(k,news[k]||[])).join('')}</div><div class="small" style="margin-top:17px">ข่าวจาก RSS อาจมีคำอธิบายสั้นหรือเป็นภาษาอังกฤษ และอาจไม่มีข่าวครบทุกหมวด · กดหัวข้อเพื่ออ่านรายละเอียดหรือไปยังต้นฉบับ</div>`}`}
function renderDeep(){let b=briefs.find(x=>x.id===selectedBrief)||briefs[0];app.innerHTML=`<div class="split"><section class="card"><div class="cardhead"><h3>📖 Your Daily Deep Dive</h3><button class="btn primary" data-add>＋ วาง Daily Brief</button></div><p class="hint">คัดลอกข้อความจาก ChatGPT แบบเดิม วางได้เลย ไม่ต้องแปลง JSON · เก็บในเบราว์เซอร์นี้เท่านั้น</p>${briefs.length?briefs.map(x=>`<div class="libraryrow"><div><strong>${esc(dateTH(x.date))}</strong><div class="small">${esc(x.title||'Daily Knowledge Brief')}</div></div><div class="bar"><button class="btn" data-brief="${esc(x.id)}">อ่าน</button><button class="btn" data-delete="${esc(x.id)}" aria-label="ลบฉบับ">🗑</button></div></div>`).join(''):'<div class="empty">ยังไม่มี Daily Brief ที่นำเข้า กด “วาง Daily Brief” เพื่อเพิ่มฉบับแรก</div>'}<div class="bar"><button class="btn" data-example>ดูตัวอย่าง 14 ต.ค.</button><button class="btn" data-export>ส่งออกข้อมูลสำรอง</button></div></section><section class="card"><h3>✨ อ่านแบบจัดรูปแบบ</h3><p>วางข้อความจาก ChatGPT ได้เลย เว็บจะแสดงหัวข้อ ตัวหนา ตาราง ลิงก์ รายการ และเฉลยเกมเป็นบทความอ่านง่าย</p><div class="soft"><b>ไม่ต้องทำทุกวันก็ได้</b><br>หน้า Today จะดึงข่าว RSS อัตโนมัติอยู่แล้ว ส่วน Deep Dive ใช้สำหรับวันที่อยากเก็บฉบับเต็มไว้กลับมาอ่าน</div></section></div>${b?`<section class="card" style="margin-top:17px"><div class="cardhead"><h3>📚 ${esc(b.title||'Daily Knowledge Brief')} · ${esc(dateTH(b.date))}</h3><button class="btn" data-export>↧ สำรอง</button></div><div class="read">${md(b.text)}</div></section>`:''}`}
function renderGames(){let stored=briefs.find(x=>x.id===selectedBrief)||briefs[0];let cards=stored?.games?.length?stored.games:fallbackGames;app.innerHTML=`<div class="hero"><div><div>YOUR DAILY BRAIN BREAK</div><h2>คิดเล่น ๆ ให้สมองสดชื่น 🧠</h2><p>3 เกมตรรกะ ฝึกคิดก่อนเปิดเฉลย</p></div><div class="heroStat">🎯<strong>${cards.length}</strong><small>เกม</small></div></div><div class="card" style="margin-top:20px"><div class="cardhead"><h3>🎮 เกมวันนี้</h3><span class="hint">${stored?.games?.length?'จาก Daily Brief ที่คุณนำเข้า':'ชุดเกมตัวอย่างหมุนเวียน'}</span></div>${cards.map((g,i)=>`<article class="game"><h3>${i+1}. ${esc(g.title)}</h3><p>${esc(g.question)}</p><details><summary style="cursor:pointer;color:var(--primary);font-weight:800">เปิดเฉลย →</summary><div class="answer">${esc(g.answer)}</div></details></article>`).join('')}</div>`}
function renderLibrary(){app.innerHTML=`<div class="grid"><section class="card"><h3>🗓 ข่าว RSS ย้อนหลัง</h3><div class="hint">เก็บไฟล์ข่าวทุกวันที่ระบบดึงสำเร็จบน GitHub Pages</div>${archive.length?archive.map(d=>`<div class="libraryrow"><strong>${esc(dateTH(d))}</strong><button class="btn" data-day="${esc(d)}">เปิดฉบับ →</button></div>`).join(''):'<div class="empty">ยังไม่มีคลังข่าวจาก GitHub หรือยังโหลดไม่สำเร็จ</div>'}</section><section class="card"><h3>📖 Deep Dive ที่เก็บไว้</h3>${briefs.length?briefs.map(b=>`<div class="libraryrow"><strong>${esc(dateTH(b.date))}</strong><button class="btn" data-brief="${esc(b.id)}">อ่านฉบับ →</button></div>`).join(''):'<p class="hint">ยังไม่มีฉบับที่นำเข้า</p>'}<p class="hint">ข้อมูล Deep Dive เก็บไว้ในเครื่องที่นำเข้า ไม่ซิงก์ข้ามอุปกรณ์ · สำรองด้วยปุ่มส่งออก</p><button class="btn" data-export>↧ สำรอง Deep Dive</button></section></div>`}
function renderSaved(){app.innerHTML=`<section class="card"><div class="cardhead"><h3>♡ ข่าวที่บันทึกไว้</h3><span class="hint">${saved.length} ข่าว</span></div>${saved.length?saved.map((x,i)=>story(x.item,i)).join(''):'<div class="empty">กด ♡ ในหน้าข่าวเพื่อเก็บไว้อ่านภายหลัง<br>บันทึกอยู่บนเบราว์เซอร์นี้</div>'}</section>`}
function render(){for(let n of document.querySelectorAll('[data-view]'))n.classList.toggle('active',n.dataset.view===view);$('pageTitle').textContent={today:'ข่าววันนี้ของคุณ ✨',deep:'Daily Deep Dive 📖',games:'Brain Break 🧠',library:'Your Library 📚',saved:'ข่าวที่บันทึก ♡'}[view];({today:renderToday,deep:renderDeep,games:renderGames,library:renderLibrary,saved:renderSaved}[view])()}
function switchView(s){view=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function closeModal(){$('modalRoot').innerHTML=''}
function modal(html){$('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="modal"><button class="close" data-close>✕</button>${html}</div></div>`}
function openNews(key){let n=findNews(key);if(!n)return;modal(`<h2>${esc(n.title)}</h2><p class="small">${esc(n.source||'')} ${esc(n.published||'')}</p><div class="articleSummary">${esc(n.summary||'RSS ของแหล่งข่าวนี้ไม่ได้ให้ข้อความสรุป')}</div><div class="bar"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(safeUrl(n.url))}">อ่านต้นฉบับที่สำนักข่าว ↗</a></div><div class="small">รายละเอียดจาก RSS อาจเป็นข้อความสั้น ไม่ใช่บทความเต็มหรือบทสรุปโดย AI</div>`)}
function extractGames(text){let games=[],part=text.split(/#\s*🙈\s*เฉลย Mini Games/i)[0];let rex=/^##\s*[^\n]*(?:GAME\s*([1-3]))\s*[—–-]\s*(.+)$/gmi,match,found=[];while((match=rex.exec(part)))found.push({num:match[1],title:match[2].trim(),start:rex.lastIndex});for(let i=0;i<found.length;i++){let f=found[i],end=i<found.length-1?rex.lastIndex:part.length;let next=i<found.length-1?part.indexOf('##',f.start):part.length;let body=part.slice(f.start,next<0?end:next).replace(/---/g,'').trim();let answerHeading=new RegExp('<summary>[^\\n]*GAME\\s*'+f.num+'[^\\n]*<\\/summary>','i');let am=text.match(answerHeading);let answer='ดูเฉลยในเนื้อหา Deep Dive';if(am){let after=text.slice(am.index+am[0].length);answer=after.split('</details>')[0].replace(/<[^>]*>/g,'').trim()}games.push({title:f.title,question:body.slice(0,1000),answer:answer.slice(0,1800)})}return games}
function detectDate(text){let match=text.match(/(?:วัน(?:จันทร์|อังคาร|พุธ|พฤหัสบดี|ศุกร์|เสาร์|อาทิตย์)ที่\s*)?(\d{1,2})\s*(มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม)\s*(25\d{2}|20\d{2})/);if(!match)return todayLocal();let months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];let y=+match[3];if(y>2400)y-=543;return `${y}-${String(months.indexOf(match[2])+1).padStart(2,'0')}-${match[1].padStart(2,'0')}`}
function addBrief(){modal(`<h2>＋ เพิ่ม Daily Deep Dive</h2><p class="hint">ก๊อปข้อความ Daily Brief ทั้งฉบับจาก ChatGPT แล้ววางด้านล่าง รองรับ Markdown รวมตาราง ลิงก์ หัวข้อและเฉลยเกม</p><textarea id="briefText" class="field" placeholder="# 🗞️ DAILY KNOWLEDGE BRIEF&#10;## วันพุธที่ ...&#10;&#10;วางข้อความฉบับเต็มตรงนี้"></textarea><div class="bar"><label class="btn">📎 อ่านจากไฟล์ .txt / .md / .json<input type="file" id="briefFile" accept=".txt,.md,.json,text/plain,application/json" style="display:none"></label><button class="btn primary" id="saveBrief">บันทึก Deep Dive</button></div><p class="small">ส่วนนี้บันทึกเฉพาะเบราว์เซอร์ที่ใช้อยู่ อย่าลืมส่งออกเพื่อสำรองหากต้องการย้ายเครื่อง</p>`);$('briefFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();if(f.name.endsWith('.json')){try{let obj=JSON.parse(t);t=obj.original_markdown||obj.markdown||obj.text||JSON.stringify(obj,null,2)}catch{}}$('briefText').value=t};$('saveBrief').onclick=()=>{let t=$('briefText').value.trim();if(t.length<30){toast('กรุณาวางข้อความ Daily Brief อย่างน้อย 30 ตัวอักษร');return}let d=detectDate(t),b={id:d+'-'+Date.now(),date:d,title:(t.match(/^#\s*(.+)$/m)?.[1]||'DAILY KNOWLEDGE BRIEF').replace(/<[^>]+>/g,''),text:t,games:extractGames(t)};briefs.unshift(b);selectedBrief=b.id;persist();closeModal();switchView('deep');toast('บันทึกฉบับเต็มแล้ว ✓')}}
async function importExample(){try{let r=await fetch('examples/daily-brief-2026-10-14.md',{cache:'no-store'});if(!r.ok)throw Error();let t=await r.text();let d=detectDate(t);let old=briefs.find(b=>b.date===d&&b.isExample);if(old){selectedBrief=old.id}else{let b={id:d+'-sample',date:d,title:'DAILY KNOWLEDGE BRIEF · ตัวอย่างที่นำเข้าจากไฟล์ของคุณ',text:t,games:extractGames(t),isExample:true};briefs.unshift(b);selectedBrief=b.id;persist()}switchView('deep')}catch{toast('หาไฟล์ตัวอย่างไม่พบ กรุณาวางข้อความด้วยตัวเอง')}}
function exportBriefs(){let content=JSON.stringify({version:1,exported_at:new Date().toISOString(),briefs},null,2);let blob=new Blob([content],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily-brief-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function loadNews(){try{let r=await fetch('data/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('missing');let j=await r.json();if(!j.date||!Array.isArray(j.thailand))throw Error('invalid');news=j}catch(e){news=null}render()}
async function loadArchive(){try{let r=await fetch('data/archive.json?ts='+Date.now());if(!r.ok)throw Error();let j=await r.json();archive=j.dates||[]}catch{archive=[]}if(view==='library')render()}
async function openDay(day){try{let r=await fetch('data/'+encodeURIComponent(day)+'.json');if(!r.ok)throw Error();let j=await r.json();news=j;selectedDay=day;category='all';switchView('today');toast('เปิดข่าววันที่ '+dateTH(day)+' · กดรีเฟรชเพื่อกลับข่าวล่าสุด')}catch{toast('โหลดไฟล์ข่าวย้อนหลังไม่สำเร็จ')}}
document.addEventListener('click',async e=>{let v=e.target.closest('[data-view]');if(v){switchView(v.dataset.view);return}let cat=e.target.closest('[data-cat]');if(cat){category=cat.dataset.cat;render();return}let o=e.target.closest('[data-open]');if(o){openNews(o.dataset.open);return}let s=e.target.closest('[data-save]');if(s){let key=s.dataset.save,n=findNews(key);if(!n)return;let i=saved.findIndex(x=>x.key===key);if(i>=0)saved.splice(i,1);else saved.unshift({key,item:n});persist();render();return}let b=e.target.closest('[data-brief]');if(b){selectedBrief=b.dataset.brief;switchView('deep');return}let day=e.target.closest('[data-day]');if(day){openDay(day.dataset.day);return}if(e.target.closest('[data-example]')){importExample();return}if(e.target.closest('[data-export]')){exportBriefs();return}if(e.target.closest('[data-add]')){addBrief();return}let del=e.target.closest('[data-delete]');if(del){if(confirm('ลบ Daily Brief ฉบับนี้ใช่ไหม?')){briefs=briefs.filter(x=>x.id!==del.dataset.delete);persist();render()}return}if(e.target.closest('[data-refresh]')){loadNews();return}if(e.target.closest('[data-close]')||e.target.id==='overlay')closeModal()});
$('addBtn').onclick=addBrief;$('darkBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(KEYS.theme,document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem(KEYS.theme)==='1')document.body.classList.add('dark');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();loadNews();loadArchive();
</script></body></html>
