</style></head><body><div class="layout"><aside class="sidebar"><div class="logo"><span class="sun">☀</span>Daily Brief</div><div class="tagline">Your little brighter day. Every day.</div><div class="nav" id="sidebarNav"><button class="active" data-view="home"><span class="symbol">⌂</span> วันนี้</button><button data-view="archive"><span class="symbol">▦</span> ฉบับย้อนหลัง</button><button data-view="saved"><span class="symbol">♡</span> ข่าวที่บันทึก</button><button data-view="game"><span class="symbol">♧</span> Brain Break</button><button data-view="about"><span class="symbol">⚙</span> ตั้งค่า / วิธีใช้งาน</button></div><div class="sidebottom"><div class="sidecard">✨ <b>อ่านวันละนิด รู้ทันทุกเรื่อง</b><br>ข่าวไทย • ข่าวโลก • เศรษฐกิจ • เพลง • BTS • เรื่องน่ารู้ • มินิเกม</div></div></aside><main class="main"><div class="topbar"><div><div class="eyebrow" id="todaylabel">YOUR PERSONAL NEWSPAPER</div><h1 id="pageTitle">ข่าวเช้านี้ของคุณ ✨</h1></div><div class="topactions"><button class="round" id="themeBtn" title="สลับโหมดมืด">☾</button><button class="primary" id="importBtn">＋ เพิ่ม Daily Brief</button></div></div><div id="app"></div><div class="footer">Daily Brief · เว็บส่วนตัวของคุณ · ข่าวจากแหล่งต้นทาง โปรดตรวจสอบรายละเอียดก่อนใช้อ้างอิง</div></main></div><nav class="mobilebar" id="mobileNav"><button data-view="home" class="active"><span>⌂</span>วันนี้</button><button data-view="archive"><span>▦</span>ย้อนหลัง</button><button data-view="saved"><span>♡</span>บันทึก</button><button data-view="game"><span>♧</span>เกม</button><button data-view="about"><span>⚙</span>ตั้งค่า</button></nav><div id="modals"></div><div id="toast" class="toast hidden"></div><script>
const EXAMPLE={date:'',type:'demo',thailand:[{title:'นี่คือพื้นที่สำหรับ Top 5 ข่าวไทยประจำวัน',summary:'เมื่อเชื่อมแหล่งข่าวหรือวางข้อความ Daily Brief ข่าวจริงจะปรากฏในส่วนนี้',source:'ตัวอย่าง',url:'',icon:'🇹🇭'}],world:[{title:'Top 5 ข่าวต่างประเทศ — รอข้อมูลฉบับแรก',summary:'ข่าวต่างประเทศพร้อมรายละเอียดและลิงก์ต้นทาง',source:'ตัวอย่าง',url:'',icon:'🌏'}],finance:[{title:'สรุปเศรษฐกิจและการเงิน',summary:'ติดตามภาพรวมเศรษฐกิจ หุ้น และประเด็นสำคัญ',icon:'📈'}],music:[{title:'Music Radar — เพลงสากล อัลบั้มน่าฟัง Top 5',summary:'Taylor Swift, Ariana Grande, Olivia Rodrigo, Sabrina Carpenter และศิลปินที่น่าสนใจ',icon:'🎵'},{title:'BTS Update',summary:'ข่าว BTS พร้อมแหล่งข้อมูลที่ตรวจสอบได้',icon:'💜'}],knowledge:[{title:'Knowledge Snack',summary:'เกร็ดความรู้สั้น ๆ ประจำวัน',icon:'💡'}],history:[{title:'Today in History',summary:'เรื่องราวสำคัญที่เกิดขึ้นในวันนี้ของอดีต',icon:'📅'}],quick:[],thought:'วันละ 5–10 นาที ก็เรียนรู้โลกได้มากขึ้น'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const dateNow=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const humanDate=d=>{try{return new Date(d+'T12:00:00+07:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Bangkok'})}catch{return d}}; const key='personal_daily_brief_v1';let entries=JSON.parse(localStorage.getItem(key)||'{}'), saved=new Set(JSON.parse(localStorage.getItem(key+'_saved')||'[]')),view='home',cat='all',activeDate=Object.keys(entries).sort().at(-1)||dateNow(),allItems=[];let dark=localStorage.getItem(key+'_dark')==='yes';document.body.classList.toggle('dark',dark);

function normalize(o){const out={...EXAMPLE,...o};for(const k of ['thailand','world','finance','music','knowledge','history','quick','technology','sports']){out[k]=Array.isArray(o[k])?o[k]:[]}return out}
function newsItem(x,i,group){const id=itemId(x),index=allItems.push({...x,group})-1;return `<div class="newsrow"><span class="number">${i+1}</span><span class="thumb">${esc(x.icon||({thailand:'🇹🇭',world:'🌏',finance:'📈',music:'🎵'}[group]||'📰'))}</span><div class="newsbody"><button class="headline" data-read="${index}">${esc(x.title)}</button><div class="meta">${esc(x.source||'Daily Brief')} ${x.published?' · '+esc(x.published):''}</div></div><button class="save ${saved.has(id)?'saved':''}" data-save="${index}" title="บันทึกข่าว">${saved.has(id)?'♥':'♡'}</button></div>`}function panel(title,items,group,emoji,limit=5){return `<section class="panel" data-group="${group}"><div class="panelhead"><h3>${emoji} ${title}</h3><button data-filter="${group}">ดูทั้งหมด →</button></div>${items.length?items.slice(0,limit).map((x,i)=>newsItem(x,i,group)).join(''):'<p class="subtle">ยังไม่มีข่าวในหมวดนี้</p>'}</section>`}
function dashboard(){const b=normalize(entries[activeDate]||EXAMPLE),isDemo=!entries[activeDate],tabs=[['all','ทั้งหมด'],['thailand','ข่าวไทย'],['world','ต่างประเทศ'],['finance','การเงิน'],['technology','เทคโนโลยี'],['sports','กีฬา'],['music','เพลง'],['knowledge','ความรู้']];allItems=[];$('#pageTitle').textContent='ข่าวเช้านี้ของคุณ ✨';const cards=[panel('Top 5 ข่าวไทย',b.thailand,'thailand','🇹🇭'),panel('Top 5 ข่าวโลก',b.world,'world','🌍'),panel('เศรษฐกิจและการเงิน',b.finance,'finance','📈'),panel('Music Radar & BTS',b.music,'music','🎶',4),`<section class="panel" data-group="game"><div class="panelhead"><h3>🏆 Today's Challenge</h3></div><div class="gameillustration">🧩</div><b>โจทย์ท้าสมองวันนี้</b><p class="subtle">ฝึกตรรกะสั้น ๆ ใน 2 นาที</p><button class="minibtn" data-view="game">เล่นเลย →</button></section>`,panel('Knowledge Snack',b.knowledge,'knowledge','💡',2),panel('วันนี้ในอดีต',b.history,'history','🗓️',2)];let shown=cat==='all'?cards:cards.filter(c=>c.includes(`data-group="${cat}"`));return `<div class="hero"><div><div class="date">✦ ${humanDate(activeDate)}</div><h2>Good morning ☀</h2><p>${isDemo?'พื้นที่อ่านข่าวส่วนตัวของคุณ พร้อมสำหรับ Daily Brief ฉบับแรก':'เรื่องสำคัญวันนี้ สรุปมาให้แล้วในที่เดียว — อ่านง่ายพร้อมลิงก์ต้นทาง'}</p></div><div class="heroStats"><div class="stat"><span>ฉบับวันที่</span><strong style="font-size:17px">${humanDate(activeDate).split(' ').slice(0,2).join(' ')}</strong><small>${isDemo?'ตัวอย่างหน้าตาเว็บไซต์':'ฉบับที่บันทึกแล้ว'}</small></div><div class="stat"><span>เวลาอ่านโดยประมาณ</span><strong>7 นาที</strong><small>อ่านนิดเดียว ได้ทั้งโลก</small></div></div></div>${isDemo?'<div style="margin-top:13px;color:#9a681c;background:#fff5df;padding:13px;border-radius:11px">ℹ️ ตอนนี้เป็น <b>หน้าตัวอย่าง</b> ยังไม่มีข่าวจริงของวันนี้ กด “เพิ่ม Daily Brief” หรือ “ดึงข่าวออนไลน์” เพื่อเริ่มใช้งาน</div>':''}<div class="tabs">${tabs.map(t=>`<button class="tab ${cat===t[0]?'active':''}" data-filter="${t[0]}">${t[1]}</button>`).join('')}</div>${cat==='all'?`<div class="cols">${shown.slice(0,3).join('')}</div><div class="below">${shown.slice(3).join('')}</div>`:`<div class="cols">${shown.join('')||'<div class="empty">ยังไม่มีข้อมูลในหมวดนี้</div>'}</div>`}<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="refreshBtn">↻ ดึงข่าวออนไลน์</button><button class="secondary" id="importAnotherBtn">＋ นำเข้า Daily Brief ของ ChatGPT</button><span class="subtle" style="align-self:center">${b.type==='rss'?'ข่าวจาก RSS — อ่านฉบับเต็มจากลิงก์ต้นทาง':isDemo?'เนื้อหาในหน้านี้เป็นข้อความตัวอย่าง ไม่ใช่ข่าวปัจจุบัน':'ข้อมูล Daily Brief ของคุณ'}</span></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#todaylabel').textContent='YOUR PERSONAL NEWSPAPER · '+humanDate(dateNow());if(view==='home')$('#app').innerHTML=dashboard();else if(view==='archive'){let dates=Object.keys(entries).sort().reverse();$('#pageTitle').textContent='ฉบับย้อนหลัง 📚';$('#app').innerHTML=`<div class="sectiontitle"><h3>Daily Brief ที่เก็บไว้ (${dates.length} ฉบับ)</h3></div>${dates.length?dates.map(d=>`<div class="panel" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><div><b>🗞️ ${humanDate(d)}</b><p class="subtle">${(entries[d].thailand||[]).length} ข่าวไทย · ${(entries[d].world||[]).length} ข่าวโลก</p></div><button class="minibtn" data-date="${d}">เปิดอ่าน →</button></div>`).join(''):'<div class="empty">ยังไม่มีฉบับย้อนหลัง ลองเพิ่ม Daily Brief ฉบับแรก</div>'}`}else if(view==='saved'){allItems=[];$('#pageTitle').textContent='ข่าวที่บันทึกไว้ ♡';let unique=new Map;Object.values(entries).forEach(b=>Object.keys(b).forEach(k=>{if(Array.isArray(b[k]))b[k].forEach(x=>{if(saved.has(itemId(x)))unique.set(itemId(x),{...x,group:k})})}));$('#app').innerHTML=`<div class="panel"><div class="panelhead"><h3>รายการที่อยากกลับมาอ่าน</h3></div>${[...unique.values()].length?[...unique.values()].map((x,i)=>newsItem(x,i,x.group)).join(''):'<div class="empty">กด ♡ ที่ข่าวเพื่อบันทึกไว้ที่นี่</div>'}</div>`}else if(view==='game'){let question='ในกล่องมีลูกบอลสีแดง 5 ลูก สีน้ำเงิน 5 ลูก และสีเขียว 5 ลูก ถ้าหยิบโดยไม่มอง อย่างน้อยต้องหยิบกี่ลูก จึงมั่นใจว่าจะได้ลูกบอลสีเดียวกัน 3 ลูก?';$('#pageTitle').textContent='Brain Break 🧩';$('#app').innerHTML=`<div class="panel" style="max-width:710px"><div class="eyebrow">TODAY’S LOGIC CHALLENGE</div><h2>ลองคิดสักนิด</h2><div class="gamequestion">${question}</div><label>คำตอบของคุณ: <input id="gameanswer" type="number" min="1" max="15" placeholder="จำนวนลูก" style="width:130px"></label><button class="primary" id="checkAnswer">ตรวจคำตอบ</button><div id="gameResult"></div></div>`}else{$('#pageTitle').textContent='ตั้งค่าและการใช้งาน ⚙';$('#app').innerHTML=`<div class="panel" style="max-width:850px"><h3>Daily Brief ของคุณ</h3><p>เว็บนี้เก็บฉบับข่าวไว้ในเบราว์เซอร์เครื่องนี้ เปิดอ่านย้อนหลังและบันทึกข่าวได้</p><p><b>1.</b> กด “ดึงข่าวออนไลน์” เพื่ออ่านพาดหัวล่าสุดจาก Google News RSS เมื่อเปิดเว็บจาก GitHub Pages (รีเฟรชข่าวผ่าน GitHub Actions ฟรี)</p><p><b>2.</b> กด “เพิ่ม Daily Brief” แล้ววางเนื้อหา Daily Brief ที่ได้รับใน ChatGPT เพื่อเก็บฉบับเดียวกับที่อ่านในแชต</p><p><b>3.</b> ข่าว RSS อัปเดตด้วย GitHub Actions ประมาณ 07:15 น. เวลาไทย (เวลาอาจคลาดเคลื่อน) และบันทึกย้อนหลังไว้บนเว็บไซต์</p><p><b>4.</b> สามารถนำเข้า JSON เพื่อเก็บหมวดข่าวและลิงก์ได้แม่นยำที่สุด</p><p class="subtle">ข่าว RSS เป็นพาดหัว/คำอธิบายจากฟีด ไม่ใช่ AI สรุปครบแบบ ChatGPT และไม่มีราคาเรียลไทม์ ข้อจำกัด: เว็บไซต์ไม่สามารถเปิดอ่านข้อความใน ChatGPT หรือดึงข้อความจากระบบแจ้งเตือนของ ChatGPT ได้เองโดยตรง จึงมีระบบนำเข้าแทน</p><button class="secondary" id="exportBtn">↓ ส่งออกข้อมูลทั้งหมด (.json)</button> <button class="secondary" id="clearBtn">ลบข้อมูลทั้งหมดในเครื่องนี้</button></div>`}bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;cat='all';render();window.scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{cat=b.dataset.filter;render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{activeDate=b.dataset.date;view='home';cat='all';render()});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>openReader(allItems[+b.dataset.read]));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=itemId(allItems[+b.dataset.save]);saved.has(id)?saved.delete(id):saved.add(id);persist();render()});for(let id of ['refreshBtn'])if($('#'+id))$('#'+id).onclick=loadFeeds;for(let id of ['importAnotherBtn'])if($('#'+id))$('#'+id).onclick=showImport;if($('#checkAnswer'))$('#checkAnswer').onclick=()=>{let a=+$('#gameanswer').value;$('#gameResult').innerHTML=`<div class="answer">${a===7?'✅ ถูกต้อง!':'คำตอบคือ 7 ลูก'} เพราะในกรณีแย่ที่สุดเราหยิบสีละ 2 ลูก (รวม 6 ลูก) ลูกที่ 7 จะทำให้มีสีหนึ่งครบ 3 ลูกแน่นอน</div>`};if($('#exportBtn'))$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-brief-backup.json';a.click();URL.revokeObjectURL(a.href)};if($('#clearBtn'))$('#clearBtn').onclick=()=>{if(confirm('ลบ Daily Brief ทุกฉบับในเบราว์เซอร์นี้?')){entries={};saved.clear();persist();activeDate=dateNow();render()}}}
function openReader(x){if(!x)return;openDialog(`<button class="secondary" onclick="closeDialog()" style="float:right">✕ ปิด</button><span class="sourcebadge">${esc(x.source||'Daily Brief')}</span><h2 style="line-height:1.5;margin-top:16px">${esc(x.title)}</h2><div class="reader"><p>${esc(x.summary||'อ่านรายละเอียดเพิ่มเติมที่ต้นทาง')}</p>${x.detail?'<p>'+esc(x.detail)+'</p>':''}${x.why?'<h3>ทำไมควรรู้?</h3><p>'+esc(x.why)+'</p>':''}</div>${x.url&&/^https?:\/\//.test(x.url)?`<a href="${esc(x.url)}" class="primary" target="_blank" rel="noopener noreferrer" style="display:inline-block">อ่านข่าวจากแหล่งต้นทาง ↗</a>`:''}`)}
function showImport(){openDialog(`<button class="secondary" onclick="closeDialog()" style="float:right">✕ ปิด</button><h2>🗞️ เพิ่ม Daily Brief</h2><p class="subtle">วางข้อความข่าวจาก ChatGPT หรือ JSON ตามตัวอย่างในไฟล์ sample-brief.json · ข้อมูลจะเก็บอยู่บนเบราว์เซอร์ของคุณ</p><label>วันที่ฉบับ: <input type="date" id="importDate" value="${dateNow()}"></label><textarea id="importText" placeholder="วางข้อความ Daily Brief ที่ได้รับใน ChatGPT ที่นี่ ...\n\nหรือวาง JSON ในรูปแบบ {\"thailand\":[{\"title\":\"...\",\"summary\":\"...\"}],\"world\":[...]} "></textarea><div class="controls"><label class="secondary" style="cursor:pointer">เลือกไฟล์ JSON <input type="file" accept=".json,.txt" id="fileInput" style="display:none"></label><button class="primary" id="submitImport">บันทึกฉบับนี้</button></div><p class="subtle">ถ้าเป็นข้อความธรรมดา เว็บจะพยายามแยกหัวข้อจากข้อความโดยอัตโนมัติ แนะนำ JSON สำหรับการแยกเนื้อหาอย่างแม่นยำ</p>`);$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(f)$('#importText').value=await f.text()};$('#submitImport').onclick=()=>{let raw=$('#importText').value.trim(),date=$('#importDate').value;if(!raw||!date)return notify('กรุณาใส่ข้อมูลและวันที่');let obj;try{obj=JSON.parse(raw);if(obj.briefs&&typeof obj.briefs==='object'){Object.assign(entries,obj.briefs);persist();activeDate=Object.keys(entries).sort().at(-1);closeDialog();view='home';cat='all';render();notify('นำเข้าข้อมูลสำเร็จ');return}obj=normalize(obj);if(Object.values(obj).filter(Array.isArray).every(a=>a.length===0))throw new Error('ไม่มีหมวดข่าว')}catch(e){if(raw.startsWith('{')||raw.startsWith('['))return notify('รูปแบบ JSON ไม่ถูกต้อง');obj=parseText(raw)}obj.date=date;obj.type='import';entries[date]=obj;activeDate=date;persist();view='home';cat='all';closeDialog();render();notify('บันทึก Daily Brief สำเร็จ')}}
function parseText(raw){const keys=[[/ข่าวไทย|thailand|ในประเทศ/i,'thailand'],[/ข่าวโลก|ต่างประเทศ|world|international/i,'world'],[/เศรษฐกิจ|การเงิน|finance|money/i,'finance'],[/เพลง|music|bts|album/i,'music'],[/ความรู้|knowledge|fact|science/i,'knowledge'],[/ประวัติศาสตร์|history/i,'history'],[/เทคโนโลยี|technology|tech/i,'technology'],[/กีฬา|sports/i,'sports']];let o=normalize({}),section='quick',current=null;for(let l of raw.split(/\r?\n/)){l=l.trim();if(!l)continue;let heading=keys.find(([re])=>re.test(l)&&l.length<95&&(l.match(/^#{1,4}\s|^\p{Extended_Pictographic}/u)||/^(?:Top\s*5|ข่าวไทย|ข่าวโลก|ต่างประเทศ|เศรษฐกิจ|การเงิน|เพลง|Music|BTS|Knowledge|History|Tech|กีฬา)/i.test(l)));if(heading){section=heading[1];current=null;continue}let m=l.match(/^(?:[-*•]|\d+[.)])\s*(.+)$/);if(m){current={title:m[1],summary:'',source:'ChatGPT Daily Brief'};o[section].push(current)}else if(current){current.summary+=(current.summary?' ':'')+l}else{current={title:l,summary:'',source:'ChatGPT Daily Brief'};o[section].push(current)}}return o}
async function loadFeeds(){notify('กำลังโหลดข่าวจากแหล่ง RSS…');try{let r=await fetch('./data/latest.json?refresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('ไม่สามารถเข้าถึงเซิร์ฟเวอร์');let obj=await r.json();if(obj.error)throw Error(obj.error);if(entries[obj.date]?.type==='import'){notify('มีฉบับ ChatGPT วันนี้อยู่แล้ว — ไม่เขียนทับ');return}entries[obj.date]=normalize(obj);activeDate=obj.date;persist();view='home';cat='all';render();notify('อัปเดตพาดหัวข่าวสำเร็จ')}catch(e){openDialog(`<h2>ยังเชื่อมข่าวออนไลน์ไม่ได้</h2><p>เว็บยังไม่พบข้อมูลข่าวที่เผยแพร่ กรุณาเปิด GitHub Actions แล้วรัน Daily news refresh ครั้งแรก จากนั้นกลับมาลองอีกครั้ง</p><p class="subtle">${esc(e.message)}</p><button class="primary" onclick="closeDialog()">เข้าใจแล้ว</button>`)}}
$('#importBtn').onclick=showImport;$('#themeBtn').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem(key+'_dark',dark?'yes':'no')};render();
(async()=>{try{const m=await fetch('./data/archive.json',{cache:'no-store'});if(m.ok){const data=await m.json();for(const d of (data.dates||[]).slice(0,60)){if(entries[d])continue;try{let r=await fetch('./data/'+d+'.json');if(r.ok)entries[d]=normalize(await r.json())}catch{}}persist();activeDate=Object.keys(entries).sort().at(-1)||dateNow();render();}}catch{}})();
</script></body></html>
