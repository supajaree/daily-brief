name: Daily news refresh and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'  # approx. 07:15 Asia/Bangkok, may be delayed
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh RSS and archive
        if: github.event_name != 'push'
        run: python scripts/update_news.py
      - name: Save news data in repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'daily-brief-bot'
          git config user.email 'daily-brief-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Daily Brief news'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
